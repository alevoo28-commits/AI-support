[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f5f6fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e293b"
font = "sans serif"

[logger]
level = "warning"

[client]
showErrorDetails = false
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 200
enableXsrfProtection = true

